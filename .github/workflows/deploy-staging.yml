name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  e2e:
    needs: quality
    uses: ./.github/workflows/playwright.yml
    permissions:
      contents: read

  deploy:
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    env:
      STAGING_URL: https://lumen-staging.cescovalledev.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build staging Worker
        run: pnpm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Apply staging D1 migrations
        run: pnpm exec wrangler d1 migrations apply lumen-staging --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging Worker
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test staging
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/staging-headers.txt"
          page="$RUNNER_TEMP/staging.html"
          status=''
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output "$page" --dump-header "$response" --write-out '%{http_code}' "$STAGING_URL/")" && test "$status" = '200' && break
            sleep "$((attempt * 3))"
          done
          test "$status" = '200'
          grep -Eiq '^strict-transport-security: max-age=63072000; includeSubDomains' "$response"
          grep -Eiq '^x-frame-options: DENY' "$response"
          grep -Eiq '^x-content-type-options: nosniff' "$response"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin' "$response"
          grep -Eiq "^content-security-policy:.*frame-ancestors 'none'" "$response"
          grep -Eiq '^content-security-policy:.*upgrade-insecure-requests' "$response"
          grep -Eiq '^x-robots-tag: noindex, nofollow' "$response"
          grep -Fq "<link rel=\"canonical\" href=\"${STAGING_URL}/\"" "$page"
          security_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$STAGING_URL/.well-known/security.txt")"
          test "$security_status" = '200'
