name: Quality

# Pull requests run this directly; the staging deploy calls it as a reusable
# prerequisite on pushes to `main`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs of the same branch or PR to save Actions minutes.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check commit and pull request attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits="$(git rev-list "$PR_BASE..$PR_HEAD")" || { echo 'Unable to resolve PR commits' >&2; exit 1; }
          test -n "$commits" || { echo 'No PR commits found' >&2; exit 1; }
          if git cat-file -e "$PR_BASE:scripts/check-commit-message.sh" 2>/dev/null; then
            git show "$PR_BASE:scripts/check-commit-message.sh" > "$RUNNER_TEMP/check-commit-message.sh"
          else
            cp scripts/check-commit-message.sh "$RUNNER_TEMP/check-commit-message.sh"
          fi
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/commit-message"
            sh "$RUNNER_TEMP/check-commit-message.sh" "$RUNNER_TEMP/commit-message"
          done <<EOF
          $commits
          EOF
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request-body"
          sh "$RUNNER_TEMP/check-commit-message.sh" "$RUNNER_TEMP/pull-request-body"

      - name: Run quality checks
        run: pnpm run check
